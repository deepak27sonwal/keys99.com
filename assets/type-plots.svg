<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="Plots and land">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf7f3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="700" height="420" fill="url(#bg)"/>
  <circle cx="592" cy="98" r="32" fill="#e1a400" opacity=".18"/>

  <!-- plot, drawn in perspective -->
  <path d="M350 130 L566 236 L350 342 L134 236 Z" fill="#006b5b" opacity=".13"/>
  <path d="M350 130 L566 236 L350 342 L134 236 Z" fill="none" stroke="#006b5b" stroke-width="5" stroke-linejoin="round"/>

  <!-- subdivision lines -->
  <g stroke="#004f45" stroke-width="2.5" opacity=".45" stroke-dasharray="9 8">
    <path d="M242 183 L458 289"/>
    <path d="M458 183 L242 289"/>
  </g>

  <!-- corner survey pegs -->
  <g fill="#e1a400">
    <circle cx="350" cy="130" r="9"/>
    <circle cx="566" cy="236" r="9"/>
    <circle cx="350" cy="342" r="9"/>
    <circle cx="134" cy="236" r="9"/>
  </g>

  <!-- boundary marker post -->
  <rect x="345" y="72" width="7" height="46" rx="3.5" fill="#006b5b"/>
  <path d="M352 74 L400 86 L352 98 Z" fill="#e1a400"/>
</svg>
