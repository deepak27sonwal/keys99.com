    <rect x="248" y="174" width="34" height="30" rx="3"/>
    <rect x="304" y="174" width="34" height="30" rx="3"/>
    <rect x="192" y="224" width="34" height="30" rx="3"/>
    <rect x="248" y="224" width="34" height="30" rx="3"/>
    <rect x="304" y="224" width="34" height="30" rx="3"/>
    <rect x="192" y="274" width="34" height="30" rx="3"/>
    <rect x="304" y="274" width="34" height="30" rx="3"/>
  </g>
  <rect x="248" y="290" width="34" height="56" rx="4" fill="#e1a400"/>

  <!-- key -->
