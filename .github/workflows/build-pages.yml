name: Build project pages

# Regenerates projects/<slug>/ and sitemap.xml from Supabase and
# commits the result, so the site always reflects published projects.
on:
  workflow_dispatch:
  # Sent by Supabase when a published project changes
  # (supabase/02-instant-page-build.sql).
  repository_dispatch:
    types: [project-changed]
  schedule:
    - cron: "17 * * * *"   # hourly; new projects open via 404.html until then
  push:
    branches: [main]
    # Anything the built pages include or link to. Stylesheets and
    # scripts matter too: the build stamps each link with the file's
    # version (?v=...), so changing one must rebuild the pages or
    # browsers keep the old cached copy. (The build's own pushes use
    # GITHUB_TOKEN, which never triggers this workflow again.)
    paths:
      - "projects/property-details.html"
      - "index.html"
      - "admin/**"
      - "content/**"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "build/**"
      - "package.json"
      - ".github/workflows/build-pages.yml"

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Build on the newest main and push. If main moved while this
      # run was building (another push, or a Supabase trigger landed
      # first), start again from the new main instead of merging:
      # the pages are generated from the database, so a fresh build
      # is always the right result and there is nothing to resolve.
      # SITE_INDEXABLE stays unset until launch, so pages are noindex.
      - name: Build and commit pages
        env:
          # TESTING ON GITHUB PAGES: link-preview images (WhatsApp etc.)
          # load from the Pages address, since keys99.com does not serve
          # this site yet. Delete this line at launch on keys99.com.
          ASSET_ORIGIN: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          git config user.name "keys99-build"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            npm install --no-audit --no-fund
            node build/generate.js

            git add projects developers admin sitemap.xml index.html privacy-policy.html terms.html saved.html reels.html assets/thumbs
            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi

            git commit --quiet -m "Rebuild project pages"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during the build - rebuilding on the latest commit (attempt $attempt)"
          done

          echo "Could not push after 3 attempts"
          exit 1
